version: 2

jobs:
  build:
    docker:
      - image: circleci/node:8-browsers
      - image: circleci/mongo:3.4
    environment:
      - NODE_ENV: test
    steps:
      - checkout
      - restore_cache:
          key: dependency-cache-{{ checksum "package.json" }}
      - run:
          name: Notify build started
          command: |
            BUILD=$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}
            curl -H "Content-Type: application/json" \
            -d '{ "release": "'$BUILD'" }' \
            -X POST https://api-pipeline.dashboardhub.io/environments/0a3d9b10-f475-11e7-b823-5506a96d375b/deployed/0a3dc220-f475-11e7-b823-5506a96d375b/startBuild
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Build project
          command: npm run build
      - run:
          name: Test server
          command: npm run test:server
      - run:
          name: Notify build completed
          command: |
            BUILD=$CIRCLE_BRANCH-${CIRCLE_SHA1:0:7}
            curl -H "Content-Type: application/json" \
            -d '{ "release": "'$BUILD'" }' \
            -X POST https://api-pipeline.dashboardhub.io/environments/0a3d9b10-f475-11e7-b823-5506a96d375b/deployed/0a3dc220-f475-11e7-b823-5506a96d375b/finishBuild
      - save_cache:
          key: dependency-cache-{{ checksum "package.json" }}
          paths:
            - node_modules
      - store_artifacts:
          path: coverage
