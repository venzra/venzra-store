<h2 class="mat-headline">Promotional products</h2>

<div fxLayout="row" fxLayoutGap="20px">
    <div class="mat-elevation-z2" *ngFor="let product of products.list" fxFlex="25%">
        <div class="promotional-image">
            <img (click)="show(product)" [src]="'/api/images/' + product.promotionalImage" />
        </div>

        <div class="content">
            <h2>{{ product.displayName }}</h2>

            <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="end end">
                <button mat-button (click)="show(product)">
                    <mat-icon>add_shopping_cart</mat-icon>
                    {{ product.currentPrice | price }}
                </button>
            </div>
        </div>
    </div>
</div>
