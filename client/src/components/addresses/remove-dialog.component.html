<h1 mat-dialog-title>Confirm removal</h1>
<div mat-dialog-content>
    <p>Are you sure you want to remove the address for <strong>{{ data.address.addressee }}</strong>?</p>
</div>
<div mat-dialog-actions fxLayoutAlign="end center">
    <button mat-button type="button" (click)="cancel()" color="warn">Cancel</button>
    <button mat-raised-button type="button" (click)="confirm()" color="warn">Confirm</button>
</div>
