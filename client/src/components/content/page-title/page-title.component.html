<div class="venzra-title" fxLayout="row" [fxLayoutAlign]="align + ' start'" [style.paddingLeft.px]="align === 'start' ? 20 : 0">
    <div fxLayout="column" [fxFlex.xs]="getSize('xs')" [fxFlex.sm]="getSize('sm')" [fxFlex.md]="getSize('md')" [fxFlex.lg]="getSize('lg')" [fxFlex.xl]="getSize('xl')">
        <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="space-between">
            <div fxLayout="row" fxLayoutGap="10px">
                <button mat-icon-button *ngIf="hasBackButton" (click)="goBack()"><mat-icon>arrow_back</mat-icon></button>
                <ng-content select="h2"></ng-content>
            </div>

            <div fxLayout="row" fxLayoutGap="10px" fxLayoutAlign="center center">
                <ng-content select="a,button"></ng-content>
            </div>
        </div>

        <ng-content></ng-content>
    </div>
</div>
