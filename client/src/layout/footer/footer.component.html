<div class="venzra-footer" fxLayout="column" fxLayoutGap="20px" fxLayoutAlign="start center">
    <div fxLayout="row" fxLayoutGap="40px">
        <mat-nav-list fxLayout="column" dense>
            <h4 matSubheader>Resources</h4>
            <a mat-list-item *ngIf="hasFeature('ABOUT')" routerLink="/about">About us</a>
            <a mat-list-item *ngIf="hasFeature('CAREERS')" routerLink="/careers">Career opportunities</a>
            <a mat-list-item *ngIf="hasFeature('LOCATION')" routerLink="/locations">Our locations</a>
            <a mat-list-item *ngIf="hasFeature('CONTACT')" routerLink="/contact">Contact us</a>
        </mat-nav-list>
        <mat-nav-list fxLayout="column" dense>
            <h4 matSubheader>Legal</h4>
            <a mat-list-item routerLink="/terms">Terms and Conditions</a>
        </mat-nav-list>
    </div>
    <div class="mat-caption" fxLayout="column" fxLayoutAlign="start center">
        <div>&copy; Copyright <strong>{{ subscription.storeName }}</strong> since {{ subscription.created | date: 'yyyy' }}</div>
        <div>Powered by <a href="http://www.venzra.com" target="_blank">Venzra</a> commerce platforms</div>
    </div>
</div>
