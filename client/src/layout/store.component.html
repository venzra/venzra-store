<venzra-header [navigationToggle]="sidenav"></venzra-header>

<mat-sidenav-container>
    <mat-sidenav #sidenav
                 class="mat-elevation-z4"
                 [mode]="mobileQuery.matches ? 'over' : 'side'"
                 [fixedInViewport]="true"
                 [style.paddingTop.px]="mobileQuery.matches ? 112 : 128"
                 [style.paddingBottom.vh]="70"
    >
        <mat-nav-list dense>
            <ng-container *ngFor="let section of navigationItems">
                <a mat-list-item [routerLink]="section.link" routerLinkActive="active"><mat-icon>{{ section.icon }}</mat-icon><span>{{ section.name }}</span></a>
                <ng-container *ngFor="let filter of section.items">
                    <a mat-list-item [routerLink]="filter.link" routerLinkActive="active"><mat-icon></mat-icon><span>{{ filter.name }}</span></a>
                </ng-container>
            </ng-container>
        </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content [style.paddingTop.px]="mobileQuery.matches ? 112 : 128">
        <router-outlet></router-outlet>
    </mat-sidenav-content>
</mat-sidenav-container>

<venzra-footer></venzra-footer>
