<venzra-title>
    <h2 class="mat-display-1">Account management</h2>
</venzra-title>

<venzra-centered>
    <form (submit)="changePassword()" [formGroup]="passwordForm">
        <mat-card fxLayout="column" fxLayoutGap="20px">
            <mat-card-title>Change your password</mat-card-title>
            <mat-card-subtitle>It is good practice to change your password frequently, passwords should be complex but easy to remember.</mat-card-subtitle>

            <mat-form-field>
                <input matInput type="password" placeholder="Current Password" formControlName="current" required>
                <mat-error *ngIf="passwordForm.get(['current']).hasError('required')">This field is required.</mat-error>
            </mat-form-field>

            <mat-form-field>
                <input matInput type="password" placeholder="New Password" formControlName="password" required>
                <mat-error *ngIf="passwordForm.get(['password']).hasError('required')">This field is required.</mat-error>
                <mat-error *ngIf="passwordForm.get(['password']).hasError('strength')">{{ suggestion }}</mat-error>
            </mat-form-field>

            <mat-form-field>
                <input matInput type="password" placeholder="Confirm Password" formControlName="confirmation" required>
                <mat-error *ngIf="passwordForm.get(['confirmation']).hasError('required')">This field is required.</mat-error>
                <mat-error *ngIf="passwordForm.get(['confirmation']).hasError('match')">Passwords do not match.</mat-error>
            </mat-form-field>

            <div fxLayoutAlign="end center">
                <button mat-raised-button type="submit" color="primary" [disabled]="passwordForm.pristine || passwordForm.invalid">Change password</button>
            </div>
        </mat-card>
    </form>
</venzra-centered>
