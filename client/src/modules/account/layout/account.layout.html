<div fxLayout="row" fxFlex>
    <mat-sidenav-container>
        <mat-sidenav class="mat-elevation-z4" mode="side" opened="true">
            <mat-nav-list dense>
                <a mat-list-item routerLink="/account/profile" routerLinkActive="active">My profile</a>
                <a mat-list-item routerLink="/account/orders" routerLinkActive="active">Order history</a>

                <mat-divider></mat-divider>

                <a mat-list-item (click)="logout()">Logout</a>
            </mat-nav-list>
        </mat-sidenav>

        <div fxLayout="column" class="private-container">
            <div fxFlex="grow" class="private-content">
                <div>
                    <router-outlet></router-outlet>
                </div>
            </div>
            <mat-toolbar color="accent" role="note">
                <span fxFlex></span>
                <div fxLayout="row" fxLayoutGap="5px" fxLayoutAlign="center center">
                    <span class="mat-body-1">powered by</span>
                    <a href="http://www.venzra.com" target="_blank" fxLayout="column"><img src="http://cdn.venzra.io/logo/white/venzra-logo-xs.png" title="Powered By Venzra"></a>
                    <span class="mat-caption" fxLayoutAlign="end" fxFlex>&copy; Copyright since 2017</span>
                </div>
            </mat-toolbar>
        </div>
    </mat-sidenav-container>
</div>
