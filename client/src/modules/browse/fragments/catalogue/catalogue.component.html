<venzra-title align="start" size="wide">
    <h2 *ngIf="catalogues.list.length" class="mat-display-1">Categories</h2>
    <h2 *ngIf="!catalogues.list.length" class="mat-display-1">Products</h2>
</venzra-title>

<venzra-aligned size="wide">
    <div fxLayout="row wrap" fxLayoutGap="20px grid">
        <div *ngFor="let catalogue of catalogues.list" fxFlex="100%" fxFlex.sm="50%" fxFlex.gt-sm="33.33%" fxFlex.gt-lg="25%">
            <mat-card [venzraNavCard]="['/browse/category', catalogue.slug]">
                <img matCardImage [src]="catalogue.featureImage ? '/api/images/' + catalogue.featureImage : ''" [alt]="catalogue.name">
                <mat-card-content>{{ catalogue.name }}</mat-card-content>
                <mat-card-actions align="end">
                    <mat-icon>chevron_right</mat-icon>
                </mat-card-actions>
            </mat-card>
        </div>
    </div>
</venzra-aligned>
