<venzra-title align="start" size="wide">
    <h2 class="mat-display-1" *ngIf="!category.parent"><a routerLink="/browse">Categories</a> / {{ category.name }}</h2>
    <h2 class="mat-display-1" *ngIf="category.parent"><a routerLink="/browse">Categories</a> / <a [routerLink]="['/browse/category', category.parent.slug]">{{ category.parent.name }}</a> / {{ category.name }}</h2>
</venzra-title>

<venzra-aligned size="wide">
    <div fxLayout="row wrap" fxLayoutGap="20px">
        <div [venzraMarkdown]="category.description" fxFlex fxFlexOrder="2" fxFlexOrder.gt-sm="1"></div>
        <div *ngIf="category.featureImage" fxFlex="100%" fxFlex.gt-sm="240px" fxFlexOrder="1" fxFlexOrder.gt-sm="2">
            <img [src]="'/api/images/' + category.featureImage" [style.width.%]="100" />
        </div>
    </div>

    <ng-container *ngIf="category.children.length">
        <h3>View by category</h3>

        <div fxLayout="row wrap" fxLayoutGap="20px">
            <div *ngFor="let child of category.children" fxFlex="100%" fxFlex.sm="0 0 calc(50%-20px)" fxFlex.gt-sm="0 0 calc(33%-20px)" fxFlex.gt-lg="0 0 calc(25%-20px)">
                <mat-card [venzraNavCard]="['/browse/category', child.slug]">
                    <img matCardImage *ngIf="child.featureImage" [src]="'/api/images/' + child.featureImage" [alt]="child.name">
                    <mat-card-content>{{ child.name }}</mat-card-content>
                    <mat-card-actions align="end">
                        <mat-icon>chevron_right</mat-icon>
                    </mat-card-actions>
                </mat-card>
            </div>
        </div>
    </ng-container>

    <h3>Available products</h3>

    <div fxLayout="row wrap" fxLayoutGap="20px">
        <venzra-product *ngFor="let product of products.list" [product]="product" fxFlex="0 0 calc(50%-20px)" fxFlex.md="0 0 calc(33%-20px)" fxFlex.gt-md="0 0 calc(25%-20px)"></venzra-product>
    </div>
</venzra-aligned>
