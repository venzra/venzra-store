<div class="feature-image" [style.background-image]="featureImage"></div>

<div fxLayout="row" fxLayoutAlign="center center">
    <div fxFlex="90" fxFlex.gt-md="70" fxFlex.xl="60">
        <section class="product-detail">
            <mat-toolbar class="mat-elevation-z2" color="accent">
                <h1 fxFlex>{{ product.displayName }}</h1>
                <button mat-button (click)="purchase(product)">
                    <mat-icon>add_shopping_cart</mat-icon> Add to cart
                </button>
            </mat-toolbar>

            <mat-card>
                <mat-card-content fxLayout="column">
                    <div fxLayout="row" fxLayout.xs="column" fxLayoutGap="20px">
                        <div fxFlex="50%" fxLayoutAlign="center start">
                            <img [src]="'/api/images/' + product.promotionalImage" />
                        </div>
                        <div fxLayout="column" fxFlex="50%" fxLayoutGap="20px">
                            <div [venzraMarkdown]="product.description" fxFlex></div>
                            <mat-list>
                                <mat-list-item>
                                    <h3 matLine>Price</h3>
                                    <h4 class="pricing" matLine>{{ product.currentPrice | price }}</h4>
                                </mat-list-item>

                                <mat-list-item *ngIf="product.previousPrice && product.previousPrice !== product.currentPrice">
                                    <h3 matLine>Savings</h3>
                                    <div matLine><span>{{ 1 - product.currentPrice / product.previousPrice | percent }}</span> <span class="strike">(was {{ product.previousPrice | price }})</span></div>
                                </mat-list-item>
                            </mat-list>

                            <div fxLayout="row" fxLayoutAlign="end end">
                                <button mat-raised-button color="primary" (click)="purchase(product)">
                                    <mat-icon>add_shopping_cart</mat-icon> Add to cart
                                </button>
                            </div>
                        </div>
                    </div>
                </mat-card-content>
            </mat-card>
        </section>
    </div>
</div>
