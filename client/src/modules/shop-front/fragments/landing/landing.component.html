<div class="hero-banner" fxLayout="column" fxLayoutAlign="center center">
    <h1><img [src]="'/api/images/' + subscription.logo" [alt]="subscription.storeName" /></h1>
    <h2>{{ subscription.strapline }}</h2>
</div>

<venzra-centered>
    <div fxLayout="row wrap">
        <venzra-product *ngFor="let product of products.list" [product]="product" fxFlex="50%" fxFlex.md="33%" fxFlex.gt-md="25%"></venzra-product>
    </div>
</venzra-centered>
