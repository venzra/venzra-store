<div class="hero-banner" fxLayout="column" fxLayoutAlign="center center">
    <h1 class="mat-display-2">
        <img *ngIf="subscription.logo" [src]="'/api/images/' + subscription.logo" [alt]="subscription.storeName" />
        <span *ngIf="!subscription.logo">Welcome to {{ subscription.storeName }}</span>
    </h1>
    <h2>{{ subscription.strapline }}</h2>
</div>

<venzra-centered>
    <div fxLayout="row wrap" fxLayoutGap="20px grid">
        <venzra-product *ngFor="let product of products.list" [product]="product" fxFlex="50%" fxFlex.md="33.33%" fxFlex.gt-md="25%"></venzra-product>
    </div>
</venzra-centered>
