<mat-card [venzraNavCard]="['/products', product.slug]" fxLayout="column" fxFlex>
    <img matCardImage [venzraImage]="product.promotionalImage" [alt]="product.displayName" />
    <mat-card-content fxFlex>
        <h2>{{ product.displayName }}</h2>
    </mat-card-content>
    <mat-card-content>
        <div fxLayout="row" fxLayoutGap="10px">
            <span *ngIf="product.previousPrice" class="strike">{{ product.previousPrice | price }}</span>
            <strong>{{ product.currentPrice | price }}</strong>
        </div>
    </mat-card-content>
    <mat-card-actions align="end">
        <mat-icon>arrow_forward</mat-icon>
    </mat-card-actions>
</mat-card>
