<venzra-title align="center">
    <h2 *ngIf="!subscription.logo" class="mat-display-1">{{ subscription.storeName }}</h2>

    <div *ngIf="subscription.logo">
        <img [venzraImage]="subscription.logo" [alt]="subscription.storeName" />
    </div>

    <h3>{{ subscription.strapline }}</h3>
</venzra-title>

<venzra-centered>

    <div fxLayout="row wrap" fxLayoutGap="20px grid">
        <venzra-product *ngFor="let product of products.list" [product]="product" fxLayout="column" fxFlex="50%" fxFlex.md="33.33%" fxFlex.gt-md="25%"></venzra-product>
    </div>
</venzra-centered>
